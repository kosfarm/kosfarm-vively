<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPHINOX Vively｜科友實業原料資訊</title>
<meta name="description" content="SPHINOX Vively 類A鞘脂｜科友實業股份有限公司原料資訊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#6a4868;
    --brand:#4b6b45;
    --paper:#fbf8f1;
    --ink:#2f2f2a;
    --muted:#6d6a60;
    --line:#e4ddcc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.7;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    background:#fff;border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;
    display:flex;justify-content:center;
  }
  header img{height:34px;width:auto;max-width:100%}
  .hero{
    background:var(--accent);color:#fff;text-align:center;
    padding:40px 20px 44px;
  }
  .badge{
    display:inline-block;font-size:13px;letter-spacing:.08em;
    border:1px solid rgba(255,255,255,.6);border-radius:999px;
    padding:3px 14px;margin-bottom:14px;
  }
  .hero h1{font-size:clamp(28px,8vw,44px);font-weight:700;line-height:1.2;letter-spacing:.01em}
  .hero .sub{margin-top:10px;font-size:clamp(16px,4.6vw,20px);font-weight:500;opacity:.92}
  .content{max-width:760px;margin:0 auto;padding:24px 16px 40px}
  .notice{
    font-size:13.5px;color:var(--muted);background:#fff;
    border-left:4px solid var(--accent);border-radius:6px;
    padding:12px 14px;margin-bottom:22px;
  }
  .content figure{margin-bottom:22px}
  .content img{
    display:block;width:100%;max-width:100%;height:auto;
    border-radius:10px;background:#fff;
    box-shadow:0 1px 0 var(--line),0 6px 18px rgba(60,50,20,.08);
  }
  .content figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
  footer{
    background:var(--brand);color:#fff;text-align:center;
    font-size:13.5px;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));
    line-height:1.9;
  }
  footer a{color:#fff;text-decoration:underline;text-underline-offset:3px}
  footer strong{font-size:15px;font-weight:700}
</style>
</head>
<body>
<header>
  <img src="20230515科友LOGO_logo_中文全名標準字.png" alt="科友實業股份有限公司 KOSFARM CORPORATION">
</header>

<div class="hero">
  <div class="badge">原料樣品資訊</div>
  <h1>SPHINOX Vively</h1>
  <div class="sub">類A鞘脂</div>
</div>

<div class="content">
  <!-- ⚠️ 警語不可刪 -->
  <div class="notice">以下原料資訊依原廠資料整理提供，僅供化妝品產業人士參考，非供一般消費者，產品訴求請參照政府相關法規；請勿任意轉載。</div>
  <figure>
    <img src="Vively_EDM.jpg" alt="SPHINOX Vively 原料重點介紹">
  </figure>
  <figure>
    <img src="Vively_datasheet_cropped.png" alt="SPHINOX Vively 原料特性資料（中文單張）">
    <figcaption>點兩下或雙指放大可查看完整規格</figcaption>
  </figure>
</div>

<footer>
  <strong>科友實業股份有限公司</strong><br>
  TEL：<a href="tel:+886222232999">02-2223-2999</a>　FAX：02-8221-6326
</footer>
</body>
</html>
